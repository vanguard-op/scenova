# Alembic configuration for the Scenova primary database (architecture.md
# "Data Architecture": Cloud SQL for PostgreSQL).
#
# `sqlalchemy.url` is deliberately empty: migrations/env.py reads the database
# URL from DATABASE_URL, so the local docker-compose Postgres and the Cloud SQL
# instance are migrated by the same command and no credential is committed
# (NFR-024). `make db-migrate` locally and the migration job in the cloud both
# invoke this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
