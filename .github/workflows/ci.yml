# CI for Scenova. Every step runs the same Makefile target a developer runs
# locally, so a failure here is reproducible with `make ci` and its log is
# readable. Cheap static checks fail before the slow build and boot steps.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # CI builds every container image (and smoke-boots it) in addition to the
    # Flutter builds, so the ceiling allows a cold image build on a fresh runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The pinned Flutter SDK comes from the local composite action rather than
      # subosito/flutter-action: that action nests an unpinned `actions/cache`,
      # which the repository's `sha_pinning_required` policy refuses at setup.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.47.2"

      - name: Set up Java (Android build)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Google retired the `tools` SDK package, which setup-android@v3 still
      # lists in its default `packages`; asking for it fails with "Failed to find
      # package 'tools'" and the action dies before it exports ANDROID_HOME.
      # Request only `platform-tools`: the command-line tools (sdkmanager,
      # apkanalyzer, lint, …) are installed and put on PATH by the action
      # regardless, and the runner image already carries the platform and
      # build-tools the APK build needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Install toolchain
        run: make setup

      - name: Run CI
        run: make ci

  # The iOS app and its share extension build only on macOS with Xcode 15 or
  # newer: that is where Swift Package Manager resolves the engine and the
  # plugins, and where `xcodebuild` produces the app. The build is unsigned
  # (`--no-codesign`) because store release signing is deferred — the point here
  # is that both targets compile at all, which no Linux runner can tell us. It
  # runs on the same triggers as the rest of CI and is dispatchable by hand, and
  # `make ios` is the same command a developer runs on a Mac.
  ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same pinned Flutter the Linux job uses, installed from the official
      # macOS archive by the local composite action.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.47.2"

      # `make ios` resolves the app's Dart dependencies and builds the app and
      # its share extension unsigned, asserting the built `.appex` is present; it
      # skips on a non-macOS host, so the target is safe to run anywhere.
      - name: Build iOS app and share extension (no codesign)
        run: make ios
