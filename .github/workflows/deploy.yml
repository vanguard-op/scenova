# Deploy services to an environment (release.md "Deployment model": canary for
# services). Authenticates to Google Cloud with Workload Identity Federation, so
# no long-lived key is stored in the repository (NFR-024).
#
# Required repository configuration (values, not secrets):
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   vars.GCP_DEPLOY_SERVICE_ACCOUNT      the deploy service account email
#
# `make deploy` pushes images and shifts 5% of traffic to the candidate revision;
# promotion to 100% is a separate, deliberate run of `make promote`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod, pre-revenue]
        required: true
      promote:
        description: Promote the canary to 100% after deploy
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Node (Firebase CLI for the review console)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # `make setup` resolves the Flutter workspaces and `make deploy` builds the
      # review console as a Flutter Web bundle, so the deploy runner needs the
      # same pinned Flutter as CI.
      - name: Set up Flutter (review console)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Install toolchain
        run: make setup

      - name: Deploy canary
        env:
          GIT_SHA: ${{ github.sha }}
        run: make deploy ENV=${{ github.event.inputs.environment || 'prod' }}

      - name: Promote to 100%
        if: ${{ github.event.inputs.promote == true }}
        run: make promote ENV=${{ github.event.inputs.environment || 'prod' }}
