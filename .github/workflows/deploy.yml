# Deploy services to an environment (release.md "Deployment model": canary for
# services). Authenticates to Google Cloud with Workload Identity Federation, so
# no long-lived key is stored in the repository (NFR-024).
#
# Required repository configuration (values, not secrets):
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   vars.GCP_DEPLOY_SERVICE_ACCOUNT      the deploy service account email
#
# `make deploy` pushes images and shifts 5% of traffic to the candidate revision;
# promotion to 100% is a separate, deliberate run of `make promote`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod, pre-revenue]
        required: true
      promote:
        description: Promote the canary to 100% after deploy
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Node (Firebase CLI for the review console)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # `make setup` resolves the Flutter workspaces and `make deploy` builds the
      # review console as a Flutter Web bundle, so the deploy runner needs the
      # same pinned Flutter as CI. The local composite action installs it without
      # an unpinned nested cache, which `sha_pinning_required` refuses.
      - name: Set up Flutter (review console)
        uses: ./.github/actions/setup-flutter
        with:
          version: "3.47.2"

      - name: Install toolchain
        run: make setup

      - name: Deploy canary
        env:
          GIT_SHA: ${{ github.sha }}
        run: make deploy ENV=${{ github.event.inputs.environment || 'prod' }}

      - name: Promote to 100%
        if: ${{ github.event.inputs.promote == true }}
        run: make promote ENV=${{ github.event.inputs.environment || 'prod' }}
