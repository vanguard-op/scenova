# Paths excluded from GitHub's provider-pattern secret scanning (NFR-024).
#
# These two files carry the Firebase *client* API key — a public project
# identifier that ships inside every app binary, not a credential. GitHub's
# `google_api_key` pattern matches it and raises one `google_api_key` alert per
# platform key, so the paths are excluded by rule here, the same exemption
# `ci/checks/secret_scan.sh` applies locally. Alerts in these paths close as
# "ignored by configuration".
#
# The exclusion is path-level because GitHub has no field-level rule; the local
# scan still covers both files for every other pattern and exempts only the
# client-key field, so the files are not left unguarded. The value is required for
# the client build, so the files stay tracked. Access to the project is enforced by
# the key's API-target restriction, App Check, and Security Rules, not by keeping
# the value hidden.
paths-ignore:
  - "apps/mobile/lib/firebase_options.dart"
  - "apps/mobile/android/app/google-services.json"
