name: scenova_console
description: "Scenova — the operator-only review console for the shared word-clip library."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # The shared design system: the brand's tokens and the shared components,
  # imported rather than mirrored, so a token change and the mark's audit are
  # made once for both apps.
  scenova_design:
    path: ../../packages/scenova_design

  # The console is a web app; the path URL strategy keeps its screens on the
  # routes the docs declare (`/review`, `/review/entry/:entryId`).
  flutter_web_plugins:
    sdk: flutter

  # The platform's own icon font, so the Material icons the console's chrome
  # uses resolve at build time.
  cupertino_icons: ^1.0.8

  # Talks to the gateway's review endpoints (C-014), which carry the queue.
  http: ^1.2.0

  # Inspects the SVG the design system draws for the mark, so the console's
  # tests can assert the art both apps share.
  flutter_svg: ^2.3.0

  # Authenticates the operator session (C-014 auth): an operator's Firebase ID
  # token carrying the `curator` claim and a multi-factor session.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

  # Formats the queue's relative ages through the locale's own plural rules
  # rather than a hardcoded English string (`branding.md` → "Formats").
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The brand mark (A-001) travels with the shared design
  # system, so the console draws it from one bundle rather than
  # carrying its own copy. The product's icons come from the platform pack the
  # design system names, so no icon files travel with it.
  #
  # The delivered app icon (A-006) is the one exception. It is the console's
  # browser chrome — the favicon and install icon `web/index.html` and
  # `web/manifest.json` point at — not art either app draws in a widget, so it
  # is bundled here rather than pushed into the design system and every app that
  # imports it.
  assets:
    - assets/brand/scenova-app-icon.png

  # The brand's type (A-011): Lora for display and headings, Inter for body.
  # Both ship as variable fonts, so one file carries the whole weight axis and a
  # `fontWeight` on a text style selects the instance.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora[wght].ttf
        - asset: assets/fonts/Lora-Italic[wght].ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
        - asset: assets/fonts/Inter-Italic[opsz,wght].ttf
          style: italic
