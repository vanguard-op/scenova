name: scenova
description: "Scenova — see what words mean. The in-context clip view for readers."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Talks to the gateway for lookups (C-001, C-002).
  http: ^1.2.0

  # Renders the custom icon set and the brand mark from the SVG assets.
  flutter_svg: ^2.3.0

  # Authenticates the lookup path (C-001/C-002 auth): an anonymous ID token
  # before accounts ship, upgraded to the reader's account at sign-in.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

  # Streams the clip in the shared Clip Player, so the reader sees the clip
  # itself rather than a poster and the controls follow real playback.
  video_player: ^2.14.1

  # Issues the device push token registered against a lookup (C-008), so the
  # notification service can reach the reader when the clip is ready.
  firebase_messaging: ^16.7.0
  firebase_remote_config: ^6.7.0
  shared_preferences: ^2.5.6

  # Raises the platform's own permission prompts, so the notify offer asks for
  # notifications through the standard package rather than a hand-rolled
  # channel, and a refused permission is read as what it is. Pinned to the 12.x
  # line: its Android implementation compiles against API 35, so the app keeps
  # the compile SDK the Flutter toolchain pins.
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates the launcher icon from the delivered app-icon asset (A-006) for
  # Android and iOS.
  flutter_launcher_icons: ^0.14.4

  # Generates the native launch screens from the delivered mark (A-001) on the
  # brand's surface colour, for Android and iOS, light and dark.
  flutter_native_splash: ^2.4.8

  # Provides the in-memory platform store, so the shared_preferences-backed
  # settings store can be exercised without a device.
  shared_preferences_platform_interface: ^2.4.2

  # The permission package's platform interface, so the mapping from its
  # statuses to the app's permission states is exercised without a device.
  permission_handler_platform_interface: ^4.4.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # The custom icon set (A-008). The active state uses the filled form; the
  # default and disabled states share the outlined form and take their tone from
  # the colour tokens, so only these two variants are bundled.
  #
  # The brand mark (A-001) is bundled as the master it ships as: the square
  # canvas holds the ink in a centred 4.6:1 band, and the widget frames that
  # band. Only the mark is bundled; the one-colour and knockout forms are the
  # same art, and the mark retints to the ink token for dark surfaces.
  assets:
    - assets/icons/outlined/
    - assets/icons/filled/
    - assets/brand/scenova-mark.svg

  # The brand's type (A-011): Lora for display and headings, Inter for body.
  # Both ship as variable fonts, so one file carries the whole weight axis and a
  # `fontWeight` on a text style selects the instance.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora[wght].ttf
        - asset: assets/fonts/Lora-Italic[wght].ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
        - asset: assets/fonts/Inter-Italic[opsz,wght].ttf
          style: italic

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# The launcher icon comes from the delivered app-icon asset (A-006), a 1024×1024
# mark on the app-icon field. The legacy icon uses it whole; the adaptive icon
# reuses it as the foreground over the same field colour, so the field reads as
# one surface and the inset keeps the mark inside the safe zone.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/scenova-app-icon.png"
  adaptive_icon_background: "#F7F6F9"
  adaptive_icon_foreground: "assets/brand/scenova-app-icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24

# The native launch screens carry the mark (A-001) on the brand's surface colour
# in both themes. The mark ships as SVG, so it is exported beside the other brand
# files as a transparent PNG, in the ink token for light and the knockout value
# for dark. The export frames the mark inside a square canvas so Android 12+,
# which clips the splash icon to a circle, never cuts its ends.
flutter_native_splash:
  color: "#F7F6F9"
  color_dark: "#1B1A20"
  image: assets/brand/scenova-mark-splash.png
  image_dark: assets/brand/scenova-mark-splash-dark.png
  # The app ships on iOS and Android; web is only the preview tooling, so no
  # web splash is generated.
  web: false
  android_12:
    color: "#F7F6F9"
    color_dark: "#1B1A20"
    image: assets/brand/scenova-mark-splash.png
    image_dark: assets/brand/scenova-mark-splash-dark.png

